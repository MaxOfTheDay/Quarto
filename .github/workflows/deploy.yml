name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way; queued pushes
# collapse into one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Reads the Pages configuration. It cannot create one: the default
      # GITHUB_TOKEN is not allowed to, so Pages has to be switched on once by
      # hand (Settings -> Pages -> Source: GitHub Actions). Until it is, this
      # step fails with "Get Pages site failed ... Not Found".
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # base_path is /<repository> for a project site and empty for a user or
        # organisation site, so this is correct either way without hardcoding.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Check the build is deployable
        run: node scripts/verify-build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
